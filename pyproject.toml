[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-core"
version = "0.1.0"
description = "Reusable RAG engine library for the Nexus platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
    { name = "Nexus Team" }
]

keywords = [
    "rag",
    "retrieval",
    "embeddings",
    "llm",
    "vector-search",
    "qdrant",
    "gemini",
    "langchain",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "python-dotenv>=1.2,<2.0",

    "langchain-core>=1.4,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-google-genai>=4.2,<5.0",

    "qdrant-client>=1.18,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.15,<1.0",
    "mypy>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/nexus/nexus-core"
Repository = "https://github.com/nexus/nexus-core"
Issues = "https://github.com/nexus/nexus-core/issues"
Documentation = "https://github.com/nexus/nexus-core#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nexus"]