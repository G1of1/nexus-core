name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NEXUS_GEMINI_API_KEY: ${{ secrets.NEXUS_GEMINI_API_KEY }}
      NEXUS_QDRANT_URL: ${{ secrets.NEXUS_QDRANT_URL }}
      NEXUS_QDRANT_API_KEY: ${{ secrets.NEXUS_QDRANT_API_KEY }}
      NEXUS_QDRANT_COLLECTION: ${{ secrets.NEXUS_QDRANT_COLLECTION }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests --maxfail=1 --disable-warnings -q
